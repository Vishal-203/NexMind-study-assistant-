<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Admin Profile | AI Study Assistant</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="admin-styles.css" />
</head>
<body class="admin-page">
  <div class="app-container">
    <button class="profile-float-btn" type="button" onclick="window.location.href='admin-profile.html'" aria-label="Admin Profile">
      <span class="profile-float-btn__icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M12 12c2.485 0 4.5-2.239 4.5-5S14.485 2 12 2 7.5 4.239 7.5 7s2.015 5 4.5 5Z" fill="currentColor"/>
          <path d="M4 22c0-4.418 3.582-8 8-8s8 3.582 8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="profile-float-btn__label">Profile</span>
    </button>
    <aside class="sidebar">

      <div class="sidebar-logo" aria-label="AI Study Assistant">
        <img class="sidebar-logo__img brand-logo--neon" src="../assets/study-logo-theme.png" alt="" aria-hidden="true" />
<span class="sidebar-logo__text">NexMind</span>
      </div>

      <nav class="nav-links sidebar-nav">
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-dashboard.html#users">Users</a>
        <a href="admin-dashboard.html#content">Content</a>
        <a href="admin-dashboard.html#analytics">Analytics</a>
        <a href="admin-profile.html" class="active">Profile</a>

      </nav>
    </aside>

    <main class="main-content">
      <section class="page-hero admin-hero">
        <p class="auth-kicker">Admin Control Center</p>
        <h1>Admin Profile</h1>
        <p class="section-intro">Details and security info for administrator accounts.</p>
      </section>

      <div class="grid-2">
        <div class="card">
          <h3>Admin Metadata</h3>
          <p class="section-intro">Identity & access details for this administrator.</p>
          <p id="admin-profile-msg" style="color:var(--primary); font-size:0.9rem; margin-bottom:1rem;"></p>

          <div style="display:grid; gap:1rem;">
            <div>
              <label style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase;">Admin ID</label>
              <input id="admin-id" class="input-field" disabled style="opacity:0.6;" />
            </div>

            <div>
              <label style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase;">Email</label>
              <input id="admin-email" class="input-field" disabled style="opacity:0.6;" />
            </div>

            <div>
              <label style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase;">Username</label>
              <input id="admin-username" class="input-field" disabled style="opacity:0.6;" />
            </div>

            <div>
              <label style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase;">Role</label>
              <input id="admin-role" class="input-field" disabled style="opacity:0.6;" />
            </div>
          </div>
        </div>

        <div class="card">
          <h3>Security Protocol</h3>
          <p class="section-intro">Update the admin access credentials.</p>
          <p id="admin-password-msg" style="color:var(--primary); font-size:0.9rem; margin-bottom:1rem;"></p>

          <div style="display:flex; flex-direction:column; gap:0.75rem; margin-top:0.75rem;">
            <input id="admin-old-password" class="input-field" type="password" placeholder="Current Protocol">
            <input id="admin-new-password" class="input-field" type="password" placeholder="New Protocol">
            <input id="admin-confirm-password" class="input-field" type="password" placeholder="Confirm Protocol">
          </div>

          <button class="btn" id="admin-change-password-btn" type="button" style="margin-top:0.75rem;">Execute Protocol Update</button>


          <div style="display:flex; justify-content:center; width: 100%; margin-top: 1rem;">
            <button class="btn btn-muted logout-btn" type="button" id="admin-logout-btn" style="width: min(220px, 70%); padding: 0.45rem 0.85rem; font-size: 0.85rem;">Log out</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../app.js"></script>
  <script>
    requireAuth();
    initDarkMode();

    // Single source of truth: load from backend first, fallback to localStorage.adminUser
    (async function loadAdminProfile(){
      const adminUser = JSON.parse(localStorage.getItem('adminUser') || '{}');

      const idEl = document.getElementById('admin-id');
      const usernameEl = document.getElementById('admin-username');
      const emailEl = document.getElementById('admin-email');
      const roleEl = document.getElementById('admin-role');
      const msgEl = document.getElementById('admin-profile-msg');

      const applyIdentity = (d) => {
        const idVal = d?.id || d?._id || d?.name || '—';
        const usernameVal = d?.name || d?.username || d?.id || '—';
        const emailVal = d?.email || '—';
        const roleVal = d?.role || 'admin';

        if (idEl) idEl.value = idVal;
        if (usernameEl) usernameEl.value = usernameVal;
        if (emailEl) emailEl.value = emailVal;
        if (roleEl) roleEl.value = roleVal;
      };

      try {
        const res = await apiFetch('/admin-profile', 'GET');
        if (res && res.success) {
          applyIdentity(res.data || {});
          if (msgEl) msgEl.textContent = 'Admin profile loaded.';
          return;
        }
        if (msgEl) msgEl.textContent = res?.message || 'Could not load admin profile from server (no success flag).';
      } catch (e) {
        if (msgEl) msgEl.textContent = 'Network error while loading admin profile.';
      }

      // Fallback
      if (adminUser && Object.keys(adminUser).length > 0) {
        applyIdentity(adminUser);
        if (msgEl) msgEl.textContent = 'Loaded admin identity (from storage fallback).';
        return;
      }

      if (msgEl) msgEl.textContent = 'Admin identity not found. Please log in as admin.';
    })();




    const changeBtn = document.getElementById('admin-change-password-btn');
    const oldPwdEl = document.getElementById('admin-old-password');
    const newPwdEl = document.getElementById('admin-new-password');
    const confirmPwdEl = document.getElementById('admin-confirm-password');
    const pwdMsgEl = document.getElementById('admin-password-msg');

    if (changeBtn) {
      changeBtn.onclick = async () => {
        const oldPwd = oldPwdEl?.value || '';
        const newPwd = newPwdEl?.value || '';
        const confirmPwd = confirmPwdEl?.value || '';

        if (!oldPwd || !newPwd || !confirmPwd) return;
        if (newPwd !== confirmPwd) {
          if (pwdMsgEl) {
            pwdMsgEl.style.display = 'block';
            pwdMsgEl.style.color = '#ef5350';
            pwdMsgEl.textContent = 'New password and confirmation do not match.';
          }
          return;
        }

        if (pwdMsgEl) {
          pwdMsgEl.style.display = 'block';
          pwdMsgEl.style.color = 'var(--primary)';
          pwdMsgEl.textContent = 'Updating...';
        }

        // Backend currently exposes user password change endpoint.
        // Admin auth uses the same JWT, so this is a best-effort.
        let res;
        try {
          res = await apiFetch('/user/change-password', 'POST', {
            old_password: oldPwd,
            new_password: newPwd
          });
        } catch (e) {
          if (pwdMsgEl) {
            pwdMsgEl.style.color = '#ef5350';
            pwdMsgEl.textContent = 'Network error while updating password.';
          }
          return;
        }

        if (!res || !res.success) {
          if (pwdMsgEl) {
            pwdMsgEl.style.color = '#ef5350';
            pwdMsgEl.textContent = res?.message || 'Unable to update password.';
          }
          return;
        }

        if (pwdMsgEl) {
          pwdMsgEl.style.color = 'var(--primary)';
          pwdMsgEl.textContent = 'Password updated successfully.';
        }

        if (oldPwdEl) oldPwdEl.value = '';
        if (newPwdEl) newPwdEl.value = '';
        if (confirmPwdEl) confirmPwdEl.value = '';
      };
    }

    const logoutBtn = document.getElementById('admin-logout-btn');
    if (logoutBtn) {
      logoutBtn.onclick = () => {
        localStorage.removeItem('token');
        localStorage.removeItem('adminUser');
        // also clear any older/extra identity keys if present
        localStorage.removeItem('adminId');
        localStorage.removeItem('adminEmail');
        localStorage.removeItem('adminUsername');
        localStorage.removeItem('adminRole');
        window.location.href = 'admin-login.html';
      };
    }
  </script>
</body>
</html>
