<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Admin Login | AI Study Assistant</title>
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="admin-styles.css" />
</head>
<body class="admin-auth-page">
  <div class="admin-auth-container">
    <div class="admin-auth-card">
      <div class="admin-logo">
        <div class="admin-logo-left">
          <img class="admin-logo-img" src="../assets/study-logo-theme.png" alt="AI Study Assistant" />
          <div>
            <h1>Admin Panel</h1>
            <p>AI Study Assistant Administration</p>
          </div>
        </div>
      </div>

      <p id="login-msg" style="color: var(--primary); font-size: 0.9rem; margin-bottom: 1rem; display: none;"></p>

      <input id="admin-email" class="input-field" type="email" placeholder="Admin Email" />
      <input id="admin-password" class="input-field" type="password" placeholder="Admin Password" />

      <button class="btn admin-login-btn" id="admin-login-btn">Login to Admin Panel</button>

      <button class="profile-float-btn" id="profile-float-btn" type="button" onclick="window.location.href='admin-profile.html'">

        <span class="profile-float-btn__icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 12c2.485 0 4.5-2.239 4.5-5S14.485 2 12 2 7.5 4.239 7.5 7s2.015 5 4.5 5Z" fill="currentColor"/>
            <path d="M4 22c0-4.418 3.582-8 8-8s8 3.582 8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="profile-float-btn__label">Profile</span>
      </button>

      <div style="margin-top: 1.5rem; text-align: center;">
        <a href="../login.html" class="admin-link">Back to User Login</a>
      </div>
    </div>
  </div>

<script src="../app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const loginBtn = document.getElementById('admin-login-btn');

  loginBtn.onclick = async () => {
    const email = document.getElementById('admin-email').value.trim();
    const password = document.getElementById('admin-password').value;

    const result = await apiFetch('/auth/admin-login', 'POST', { email, password });

    if (!result.success) {
      const msg = document.getElementById('login-msg');
      msg.textContent = result.message;
      msg.style.display = 'block';
      msg.style.color = '#ef5350';
      return;
    }

    // Store admin token and redirect to dashboard
    setToken(result.data.token);
    // Persist admin identity for admin-profile page
    localStorage.setItem('adminUser', JSON.stringify(result.data.user));
    // Also persist a normalized admin identity key for robustness
    try {
      localStorage.setItem('adminId', String(result.data.user.id || ''));
      localStorage.setItem('adminEmail', String(result.data.user.email || ''));
      localStorage.setItem('adminUsername', String(result.data.user.name || result.data.user.username || ''));
      localStorage.setItem('adminRole', String(result.data.user.role || 'admin'));
    } catch (e) {}

    window.location.href = 'admin-dashboard.html';

  };
});
</script>
</body>
</html>
