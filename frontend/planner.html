<!doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<title>Study Planner | AI Study Assistant</title>
<link rel='stylesheet' href='styles.css'>
<link rel='stylesheet' href='nexmind-redesign.css'>
</head>
<body class="compact-page">
<div class="app-container">
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header" aria-label="AI Study Assistant">
<img class="sidebar-logo__img brand-logo--neon" src="assets/study-logo-theme.png" alt="" aria-hidden="true" />
<span class="sidebar-logo__text">NexMind</span>
    </div>
<nav class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="notebook.html">Notes</a>
      <a href="ai_assistant.html">AI Assistant</a>
      <a href="planner.html" class="active">Tasks</a>
    </nav>

  </aside>

  <main class="main-content">
    <section class="page-hero">
      <p class="auth-kicker">Operation Management</p>
      <h1>Task Planner</h1>
<p class="section-intro">Optimize your study cycles and manage task priorities.</p>
    </section>

    <div class="grid-2">
      <div class="card">
        <h3>Initialize Task</h3>
        <p class="section-intro">Create a new task node with specific metrics.</p>
        <div id="task-form-error" style="display:none; margin-bottom: 1rem; padding: 0.8rem; border-radius: 10px; border: 1px solid rgba(239,68,68,0.35); background: rgba(239,68,68,0.08); color: rgba(255,255,255,0.92);"></div>
        <input id="task-title" class="input-field" placeholder="Task Title">
        <input id="task-deadline" class="input-field" type="date">
        <select id="task-priority" class="input-field">
          <option value="low">Priority: Low</option>
          <option value="medium" selected>Priority: Medium</option>
          <option value="high">Priority: High</option>
        </select>
        <button class="btn" id="add-task" style="width: 100%;">Commit Task</button>
      </div>


      <div class="card">
        <h3>Active Operations</h3>
        <p class="section-intro">Review and manage current task states.</p>
        <ul id="task-list" style="list-style: none;"></ul>
        <div id="task-pagination" style="display:flex; gap:0.5rem; align-items:center; margin-top:0.75rem; flex-wrap:wrap;"></div>
      </div>
    </div>
  </main>
</div>

<button class="ask-ai-btn" onclick="openChatWidget()">Ask AI</button>

<button class="profile-float-btn" type="button" onclick="window.location.href='profile.html'">
  <span class="profile-float-btn__icon" aria-hidden="true">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M12 12c2.485 0 4.5-2.239 4.5-5S14.485 2 12 2 7.5 4.239 7.5 7s2.015 5 4.5 5Z" fill="currentColor"/>
      <path d="M4 22c0-4.418 3.582-8 8-8s8 3.582 8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </span>
  <span class="profile-float-btn__label">Profile</span>
</button>



<script src="app.js"></script>
<script src="neural-bg.js"></script>
<script src="chat-widget.js"></script>
<script>
requireAuth();
initDarkMode();



let taskPage = 1;
const taskLimit = 10;

async function loadTasks(){
  const res = await apiFetch(`/tasks?page=${taskPage}&limit=${taskLimit}`);
  const container = document.getElementById('task-list');
  const pagination = document.getElementById('task-pagination');
  if(!res.success) return;
  const tasks = Array.isArray(res.data.items) ? res.data.items : [];
  container.innerHTML='';
  if(tasks.length === 0) {
    container.innerHTML='<li style="color: var(--text-muted);">No active operations.</li>';
  } else {
    tasks.forEach(task=>{
      const li=document.createElement('li');
      li.className='card';
      li.style.padding='0.8rem 0.9rem';
      li.style.marginBottom='0.5rem';
      li.style.borderLeft='4px solid var(--primary)';
      const statusClass = task.status === 'completed' ? 'badge-success' : 'badge-warning';
      const priorityClass = task.priority === 'high' ? 'badge-danger' : task.priority === 'medium' ? 'badge-warning' : 'badge-success';
      li.innerHTML=`
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:0.5rem;">
          <div>
            <div style="font-weight: 700;">${task.title}</div>
            <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem;">Deadline: ${task.deadline}</div>
          </div>
          <div style="display:flex; flex-direction: column; gap:0.25rem; align-items: flex-end;">
            <span class="badge ${statusClass}">${task.status}</span>
            <span class="badge ${priorityClass}">${task.priority}</span>
          </div>
        </div>
        <div style="display:flex; gap:0.5rem; margin-top:0.75rem;">
          <button class="btn btn-secondary" style="padding: 0.3rem 0.8rem; font-size: 0.7rem;" onclick="markDone('${task.id}', '${task.status === 'completed' ? 'pending' : 'completed'}')">${task.status === 'completed' ? 'Revert' : 'Complete'}</button>
          <button class="btn btn-muted" style="padding: 0.3rem 0.8rem; font-size: 0.7rem;" onclick="removeTask('${task.id}')">Purge</button>
        </div>
      `;
      container.appendChild(li);
    });
  }
  updateTaskPagination(res.data);
}

function updateTaskPagination(data){
  const pagination = document.getElementById('task-pagination');
  if(!data || data.pages <= 1){ pagination.innerHTML=''; return; }
  pagination.innerHTML = `
    <button class="btn btn-secondary" style="padding: 0.3rem 0.8rem; font-size: 0.7rem;" ${data.page <= 1 ? 'disabled' : ''} onclick="changeTaskPage(-1)">Prev</button>
    <span style="font-size:0.8rem; color:var(--text-muted);">Page ${data.page} of ${data.pages}</span>
    <button class="btn btn-secondary" style="padding: 0.3rem 0.8rem; font-size: 0.7rem;" ${data.page >= data.pages ? 'disabled' : ''} onclick="changeTaskPage(1)">Next</button>
  `;
}

window.changeTaskPage = (delta) => { taskPage = Math.max(1, taskPage + delta); loadTasks(); };
window.markDone = async(id, newStatus)=>{ if((await apiFetch(`/tasks/${id}`, 'PUT', {status:newStatus})).success) loadTasks(); };
window.removeTask = async(id)=>{ if(confirm('Purge task?')) { if((await apiFetch(`/tasks/${id}`, 'DELETE')).success) loadTasks(); } };

document.getElementById('add-task') && (document.getElementById('add-task').onclick = async () => {
  const errBox = document.getElementById('task-form-error');
  const showErr = (msg) => {
    if (!errBox) return;
    errBox.textContent = msg;
    errBox.style.display = 'block';
  };
  const clearErr = () => {
    if (!errBox) return;
    errBox.textContent = '';
    errBox.style.display = 'none';
  };

  try {
    clearErr();
    if (typeof apiFetch !== 'function') {
      showErr('Client error: apiFetch is not available (app.js failed to load).');
      return;
    }

    const titleEl = document.getElementById('task-title');
    const deadlineEl = document.getElementById('task-deadline');
    const priorityEl = document.getElementById('task-priority');


    // NOTE: planner UI currently renders tasks as cards (not a table), so there is no “unstructured” column to remove.


    if (!titleEl || !deadlineEl || !priorityEl) {
      showErr('Client error: task form elements are missing from the page.');
      return;
    }

    const title = titleEl.value.trim();
    const deadline = deadlineEl.value;
    const priority = priorityEl.value;

    if (!title || !deadline) {
      showErr('Please enter both Task Title and Deadline.');
      return;
    }

    const res = await apiFetch('/tasks', 'POST', { title, deadline, priority });
    if (!res || !res.success) {
      showErr(res?.message || 'Failed to commit task.');
      return;
    }

    titleEl.value = '';
    deadlineEl.value = '';
    priorityEl.value = 'medium';

    taskPage = 1;
    await loadTasks();
  } catch (e) {
    showErr('Unexpected error while committing task.');
  }
});

loadTasks();

</script>
</body>
</html>
